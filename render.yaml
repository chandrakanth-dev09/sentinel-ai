services:
  - type: web
    name: sentinel-ai
    runtime: python
    buildCommand: python -m pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build && cd backend && python -m app.ml.train
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-ai-db
          property: connectionString
      - key: VITE_API_BASE_URL
        value: /api/v1

databases:
  - name: sentinel-ai-db
    databaseName: sentinelai
    user: sentinelai
